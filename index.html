<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Derechitos: la aventura de Tori. Juego educativo sobre los derechos de la niñez."
    />
    <meta name="theme-color" content="#2EC4BF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap"
      rel="stylesheet"
    />
    <title>Derechitos: la aventura de Tori</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #9fd9ff;
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      noscript {
        display: block;
        padding: 24px;
        font: 20px sans-serif;
        color: #2b2848;
      }
      /* Aviso suave en vertical: el juego funciona igual, pero se ve más grande en horizontal. */
      #rotate-hint {
        display: none;
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        padding: 10px 18px;
        border: 3px solid #2b2848;
        border-radius: 999px;
        background: #fff8e7;
        color: #2b2848;
        font:
          800 16px 'Nunito',
          system-ui,
          sans-serif;
        white-space: nowrap;
        pointer-events: none;
      }
      @media (orientation: portrait) and (max-width: 900px) {
        #rotate-hint {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <h1 style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">
      Derechitos: la aventura de Tori
    </h1>
    <p id="rotate-hint" role="status">↻ Gira tu celular para jugar más grande</p>
    <main id="game" aria-label="Juego Derechitos: la aventura de Tori"></main>
    <noscript>Para jugar Derechitos necesitas activar JavaScript.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
