<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Derechitos: la aventura de Tori. Juego educativo sobre los derechos de la niñez."
    />
    <meta name="theme-color" content="#2EC4BF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap"
      rel="stylesheet"
    />
    <title>Derechitos: la aventura de Tori</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #9fd9ff;
        overflow: hidden;
        /* Sin zoom accidental, sin "jalar para recargar" ni rebote al deslizar. */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }
      /* El juego ocupa la pantalla visible real (100dvh: sin quedar bajo la barra del navegador)
         y respeta muescas, cámaras y bordes redondeados (safe-area). */
      #game {
        position: fixed;
        top: env(safe-area-inset-top, 0px);
        right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px);
        left: env(safe-area-inset-left, 0px);
      }
      noscript {
        display: block;
        padding: 24px;
        font: 20px sans-serif;
        color: #2b2848;
      }

      /* ---------- Celular en vertical: invitar a girarlo (con animación, sin depender de leer) ---------- */
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 20;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        padding: 24px;
        background: #9fd9ff;
        color: #2b2848;
        font-family: 'Baloo 2', 'Nunito', system-ui, sans-serif;
        text-align: center;
      }
      #rotate svg {
        width: 132px;
        height: 132px;
        animation: girar 2.4s ease-in-out infinite;
      }
      #rotate h2 {
        margin: 0;
        font-size: 30px;
        line-height: 1.1;
      }
      #rotate p {
        margin: 0;
        font:
          700 17px 'Nunito',
          system-ui,
          sans-serif;
        max-width: 280px;
      }
      #rotate button {
        margin-top: 8px;
        min-height: 48px;
        padding: 10px 22px;
        border: 3px solid #2b2848;
        border-radius: 999px;
        background: #fff8e7;
        color: #2b2848;
        font:
          800 16px 'Nunito',
          system-ui,
          sans-serif;
        cursor: pointer;
      }
      @keyframes girar {
        0%,
        20% {
          transform: rotate(0deg);
        }
        55%,
        80% {
          transform: rotate(-90deg);
        }
        100% {
          transform: rotate(0deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #rotate svg {
          animation: none;
          transform: rotate(-90deg);
        }
      }
      /* Solo en pantallas táctiles pequeñas en vertical, y si no eligieron jugar así. */
      @media (orientation: portrait) and (max-width: 900px) and (pointer: coarse) {
        body:not(.vertical-ok) #rotate {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <h1 style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">
      Derechitos: la aventura de Tori
    </h1>
    <main id="game" aria-label="Juego Derechitos: la aventura de Tori"></main>

    <section id="rotate" role="dialog" aria-label="Gira tu celular">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <rect
          x="38"
          y="12"
          width="44"
          height="96"
          rx="10"
          fill="#fff8e7"
          stroke="#2b2848"
          stroke-width="6"
        />
        <rect x="46" y="24" width="28" height="64" rx="4" fill="#2ec4bf" />
        <circle cx="60" cy="98" r="4" fill="#2b2848" />
        <path
          d="M96 40 a34 34 0 0 1 4 40"
          fill="none"
          stroke="#ff6f6f"
          stroke-width="6"
          stroke-linecap="round"
        />
        <path
          d="M92 76 l8 6 l4 -9"
          fill="none"
          stroke="#ff6f6f"
          stroke-width="6"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <h2>¡Gira tu celular!</h2>
      <p>Derechitos se juega mejor de lado, con el celular acostado.</p>
      <button type="button" id="vertical-ok">Jugar en vertical</button>
    </section>

    <noscript>Para jugar Derechitos necesitas activar JavaScript.</noscript>
    <script>
      // "Jugar en vertical": recuerda la elección durante la sesión.
      try {
        if (sessionStorage.getItem('derechitos.vertical') === '1')
          document.body.classList.add('vertical-ok');
      } catch (e) {}
      document.getElementById('vertical-ok').addEventListener('click', function () {
        document.body.classList.add('vertical-ok');
        try {
          sessionStorage.setItem('derechitos.vertical', '1');
        } catch (e) {}
        window.dispatchEvent(new Event('resize'));
      });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
